<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5b21b6">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AP2 Lernaudio">
<meta name="mobile-web-app-capable" content="yes">
<title>AP2 Lernaudio</title>
<style>
  :root{
    --bg:#f5f3ff; --card:#ffffff; --text:#1e1b2e; --muted:#6b6785;
    --line:#e6e1f5; --field:#faf8ff; --accent:#6d28d9; --accent2:#8b5cf6;
    --green:#15803d; --amber:#b45309; --red:#b91c1c; --chip:#ede9fe;
    --hi:#ddd6fe; --qcol:#6d28d9; --acol:#15803d;
    --shadow:0 1px 3px rgba(30,27,46,.07),0 8px 24px rgba(30,27,46,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e0b18; --card:#1a1626; --text:#ece9f7; --muted:#9d97b8;
      --line:#2c2640; --field:#221d33; --accent:#a78bfa; --accent2:#c4b5fd;
      --green:#4ade80; --amber:#fbbf24; --red:#f87171; --chip:#2a2340;
      --hi:#3b2f63; --qcol:#c4b5fd; --acol:#4ade80;
      --shadow:0 1px 3px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e0b18; --card:#1a1626; --text:#ece9f7; --muted:#9d97b8;
    --line:#2c2640; --field:#221d33; --accent:#a78bfa; --accent2:#c4b5fd;
    --green:#4ade80; --amber:#fbbf24; --red:#f87171; --chip:#2a2340;
    --hi:#3b2f63; --qcol:#c4b5fd; --acol:#4ade80;
    --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0 auto;padding:14px 14px 130px;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    font-size:15px;line-height:1.45;max-width:760px;
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
  .htitle{flex:1;min-width:0}
  h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.3px;white-space:nowrap}
  .sub{font-size:12px;color:var(--muted);margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:380px){ h1{font-size:17px} .sub{font-size:11px} }
  .hbtns{display:flex;gap:6px;flex:0 0 auto}
  .icon-btn{background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .lang{display:flex;background:var(--chip);border-radius:10px;padding:2px;flex:0 0 auto}
  .lang button{border:none;background:transparent;color:var(--muted);font-weight:700;font-size:12px;
    padding:6px 10px;border-radius:8px;cursor:pointer;letter-spacing:.3px}
  .lang button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}

  .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:13px;box-shadow:var(--shadow)}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px}
  select,input,textarea{width:100%;padding:11px 12px;font-size:15px;color:var(--text);
    background:var(--field);border:1px solid var(--line);border-radius:11px;font-family:inherit}
  textarea{min-height:130px;resize:vertical;line-height:1.55}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
  input[type=number]{-moz-appearance:textfield}
  :focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
  .row{display:flex;gap:9px;align-items:flex-end}
  .row>div{flex:1;min-width:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .mb{margin-bottom:11px}
  button.b{border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;width:100%}
  button.b:active{opacity:.75}
  .b-acc{background:var(--accent)}
  button.b-ghost{background:var(--chip);color:var(--text)}
  button.b-ghost.on{background:var(--accent);color:#fff}
  button:disabled{opacity:.45;cursor:default}

  .seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;gap:2px}
  .seg button{flex:1;border:none;background:transparent;color:var(--muted);font-weight:700;
    font-size:12.5px;padding:9px 4px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

  .reader{background:var(--card);border-radius:16px;padding:6px 4px;margin-bottom:13px;
    box-shadow:var(--shadow);max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sent{padding:8px 11px;border-radius:9px;font-size:15px;line-height:1.55;cursor:pointer;
    border-left:3px solid transparent;word-break:break-word}
  .sent.q{color:var(--qcol);font-weight:600}
  .sent.a{color:var(--acol)}
  .sent.now{background:var(--hi);border-left-color:var(--accent)}
  .sent .n{font-size:10px;color:var(--muted);font-weight:700;margin-right:6px;
    font-variant-numeric:tabular-nums}
  .sent.inrange{background:linear-gradient(90deg,var(--chip),transparent)}
  .parabreak{height:9px}

  .bar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin:2px 0 9px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);
    font-weight:600;margin-bottom:8px;gap:8px;font-variant-numeric:tabular-nums}

  .dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:40;
    box-shadow:0 -4px 20px rgba(0,0,0,.10)}
  .dock-in{max-width:760px;margin:0 auto}
  .dock .ctl{display:grid;grid-template-columns:44px 1fr 44px;gap:9px;align-items:center}
  .rnd{background:var(--chip);border:none;border-radius:12px;height:46px;color:var(--text);
    font-size:17px;cursor:pointer;font-weight:700}
  .dock .now{font-size:11.5px;color:var(--muted);margin-bottom:6px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;text-align:center}
  .sleepon{color:var(--amber);font-weight:800}

  .lib{background:var(--card);border-radius:13px;padding:11px 13px;margin-bottom:8px;
    box-shadow:var(--shadow);display:flex;gap:11px;align-items:center;cursor:pointer}
  .lib .t{flex:1;min-width:0}
  .lib .t .nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lib .t .d{font-size:11.5px;color:var(--muted);margin-top:2px}
  .lib .x{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 4px}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 10px}

  .hint{font-size:11.5px;color:var(--muted);margin:8px 2px 0;line-height:1.55}
  .warn{border:1px solid var(--amber);background:color-mix(in srgb,var(--amber) 10%,transparent);
    border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.55;margin-bottom:13px}
  .warn b{color:var(--amber)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:#1e1b2e;color:#fff;
    padding:11px 18px;border-radius:22px;font-size:13.5px;font-weight:600;z-index:99;opacity:0;
    transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;
    box-shadow:0 6px 24px rgba(0,0,0,.35)}
  .toast.on{opacity:.96}
  .tiny{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6}
  .verbox{text-align:center;margin-top:12px}
  .verbox span{display:inline-block;background:var(--chip);color:var(--text);border-radius:999px;
    padding:7px 14px;font-size:12px;font-weight:700;letter-spacing:.3px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  h2{font-size:15px;margin:0 0 8px 2px;font-weight:700}
  details summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);
    list-style:none;padding:4px 2px}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"▸ ";font-size:10px}
  details[open] summary::before{content:"▾ "}
</style>
</head>
<body>

<header>
  <div class="htitle">
    <h1>AP2 Lernaudio</h1>
    <p class="sub" data-i18n="app.sub"></p>
  </div>
  <div class="hbtns">
    <div class="lang">
      <button id="langKo" onclick="setLang('ko')">KO</button>
      <button id="langDe" onclick="setLang('de')">DE</button>
    </div>
    <button class="icon-btn" id="tabBtn" data-i18n="nav.lib" onclick="toggleLib()"></button>
  </div>
</header>

<div id="noTts" class="warn" hidden><span data-i18n="warn.notts"></span></div>

<!-- ============ INPUT ============ -->
<div id="viewInput">
  <div class="card">
    <label data-i18n="f.text"></label>
    <textarea id="textIn" data-i18n-ph="ph.text"></textarea>
    <div class="grid2" style="margin-top:10px">
      <button class="b b-ghost" data-i18n="btn.file" onclick="document.getElementById('fileIn').click()"></button>
      <button class="b b-ghost" data-i18n="btn.clear" onclick="clearText()"></button>
    </div>
    <input type="file" id="fileIn" accept=".txt,.md,.pdf,text/plain,application/pdf" style="display:none" onchange="importFile(event)">
    <div class="row" style="margin-top:10px">
      <div>
        <label data-i18n="f.title"></label>
        <input id="titleIn" data-i18n-ph="ph.title">
      </div>
    </div>
    <button class="b b-acc" style="margin-top:11px" data-i18n="btn.load" onclick="loadText()"></button>
    <p class="hint" data-i18n="hint.input"></p>
  </div>
</div>

<!-- ============ LIBRARY ============ -->
<div id="viewLib" hidden>
  <h2 data-i18n="lib.title"></h2>
  <div id="libList"></div>
  <div class="grid2" style="margin-top:12px">
    <button class="b b-ghost" data-i18n="btn.newText" onclick="showInput()"></button>
    <button class="b b-ghost" data-i18n="btn.backupLib" onclick="backupLib()"></button>
  </div>
  <div style="margin-top:9px">
    <button class="b b-ghost" data-i18n="btn.restoreLib" onclick="document.getElementById('restoreIn').click()"></button>
  </div>
  <input type="file" id="restoreIn" accept=".json,application/json" style="display:none" onchange="restoreLib(event)">
</div>

<!-- ============ PLAYER ============ -->
<div id="viewPlay" hidden>
  <div class="meta">
    <span id="mTitle"></span>
    <span id="mPos"></span>
  </div>
  <div class="bar"><i id="mBar"></i></div>

  <div class="reader" id="reader"></div>

  <details class="card" id="setBox">
    <summary data-i18n="set.title"></summary>

    <div style="margin-top:12px">
      <label data-i18n="set.speed"></label>
      <div class="seg" id="segSpeed"></div>
    </div>

    <div style="margin-top:12px">
      <label data-i18n="set.loop"></label>
      <div class="seg" id="segLoop"></div>
    </div>

    <div style="margin-top:12px">
      <label data-i18n="set.sentRep"></label>
      <div class="seg" id="segSent"></div>
    </div>

    <div style="margin-top:12px">
      <label data-i18n="set.range"></label>
      <div class="grid3">
        <button class="b b-ghost" id="btnRangeA" data-i18n="btn.setA" onclick="setRange('a')"></button>
        <button class="b b-ghost" id="btnRangeB" data-i18n="btn.setB" onclick="setRange('b')"></button>
        <button class="b b-ghost" data-i18n="btn.rangeOff" onclick="clearRange()"></button>
      </div>
      <p class="hint" id="rangeInfo"></p>
    </div>

    <div style="margin-top:12px">
      <label data-i18n="set.qa"></label>
      <div class="seg" id="segQa"></div>
      <div id="qaPauseWrap" style="margin-top:9px" hidden>
        <label data-i18n="set.qapause"></label>
        <div class="seg" id="segPause"></div>
      </div>
    </div>

    <div style="margin-top:12px">
      <label data-i18n="set.voiceDe"></label>
      <select id="voiceDe" class="mb" onchange="saveSettings()"></select>
      <label data-i18n="set.voiceKo"></label>
      <select id="voiceKo" onchange="saveSettings()"></select>
      <p class="hint" data-i18n="hint.voice"></p>
    </div>
  </details>

  <div class="grid2">
    <button class="b b-ghost" data-i18n="btn.editText" onclick="editCurrent()"></button>
    <button class="b b-ghost" data-i18n="btn.toLib" onclick="toggleLib()"></button>
  </div>
</div>

<p class="tiny" id="footNote"></p>
<div class="verbox"><span id="verLine"></span></div>

<!-- ============ DOCK ============ -->
<div class="dock" id="dock" hidden>
  <div class="dock-in">
    <div class="now" id="dockNow"></div>
    <div class="ctl">
      <button class="rnd" onclick="prevSent()" aria-label="prev">⏮</button>
      <button class="b b-acc" id="btnPlay" onclick="togglePlay()"></button>
      <button class="rnd" onclick="nextSent()" aria-label="next">⏭</button>
    </div>
    <div class="seg" id="segSleep" style="margin-top:9px"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

var lang="ko";
function t(k){
  var s=(STR[lang]&&STR[lang][k])||STR.ko[k]||k;
  for(var i=1;i<arguments.length;i++) s=s.split("{"+(i-1)+"}").join(arguments[i]);
  return s;
}

/* ===================== state ===================== */
var lib=[], cur=null, chunks=[], idx=0, playing=false, loopDone=0;
var rangeA=null, rangeB=null, sentLeft=0, wake=null, sleepTimer=null, sleepEnd=0, sleepTick=null;
var voices=[], curUtt=null, pausedByUs=false;
var S={ speed:1, loop:1, sentRep:1, qa:true, qaPause:3, voiceDe:"", voiceKo:"" };

function lsGet(k,f){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function toast(m){
  var el=document.getElementById("toast"); el.textContent=m; el.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ el.classList.remove("on"); },2600);
}

/* ===================== text -> sentences ===================== */
var ABBR=["z.B","z. B","ca","bzw","d.h","d. h","u.a","usw","evtl","inkl","ggf","Nr","Abb","vgl","bspw","Dr","Prof","St","Bsp"];
function protect(s){
  ABBR.forEach(function(a,i){ s=s.split(a+".").join(a+"~@"+i+"@~"); });
  return s;
}
function unprotect(s){
  ABBR.forEach(function(a,i){ s=s.split(a+"~@"+i+"@~").join(a+"."); });
  return s;
}
var Q_RE=/^\s*(frage|aufgabe|q|f)\s*[\d.)]*\s*[:.)]\s*/i;
var A_RE=/^\s*(antwort|l[oö]sung|a)\s*[\d.)]*\s*[:.)]\s*/i;
var Q_KO=/^\s*(문제|질문)\s*[\d.)]*\s*[:.)]?\s*/;
var A_KO=/^\s*(정답|답변|답)\s*[\d.)]*\s*[:.)]?\s*/;

function hasHangul(s){ return /[ㄱ-힝]/.test(s); }

function splitSentences(line){
  var s=protect(line);
  var parts=s.split(/(?<=[.!?…])\s+/);
  if(parts.length===1) parts=[s];
  var out=[];
  parts.forEach(function(p){
    p=unprotect(p).trim();
    if(!p) return;
    /* iOS chokes on very long utterances — break further at commas */
    while(p.length>190){
      var cut=p.lastIndexOf(", ",190);
      if(cut<60) cut=p.lastIndexOf(" ",190);
      if(cut<60){ out.push(p.slice(0,190)); p=p.slice(190).trim(); }
      else { out.push(p.slice(0,cut+1).trim()); p=p.slice(cut+1).trim(); }
    }
    if(p) out.push(p);
  });
  return out;
}
/* files often break one sentence across several lines — put it back together */
function unwrap(text){
  var lines=String(text||"").replace(/\r\n?/g,"\n").split("\n"), out=[];
  for(var i=0;i<lines.length;i++){
    var L=lines[i].trim();
    if(!L){ out.push(""); continue; }
    while(i+1<lines.length){
      var N=(lines[i+1]||"").trim();
      if(!N) break;
      if(/[.!?:;]$/.test(L)) break;
      if(Q_RE.test(N)||A_RE.test(N)||Q_KO.test(N)||A_KO.test(N)) break;
      if(/^[-–—•*·]|^\d+[.)]\s/.test(N)) break;
      L=L+" "+N; i++;
    }
    out.push(L);
  }
  return out.join("\n").replace(/\n{3,}/g,"\n\n");
}
function buildChunks(text){
  var lines=String(text||"").replace(/\r\n?/g,"\n").split("\n");
  var res=[], type="t", newPara=true;
  lines.forEach(function(raw){
    var line=raw.trim();
    if(!line){ newPara=true; return; }
    var t2=type, stripped=line;
    if(Q_RE.test(line)||Q_KO.test(line)){ t2="q"; stripped=line.replace(Q_RE,"").replace(Q_KO,""); }
    else if(A_RE.test(line)||A_KO.test(line)){ t2="a"; stripped=line.replace(A_RE,"").replace(A_KO,""); }
    if(t2!=="t") type=t2;
    if(!stripped.trim()) return;
    splitSentences(stripped).forEach(function(sen,i){
      res.push({ text:sen, type:type, lang:hasHangul(sen)?"ko":"de", para:(newPara&&i===0) });
    });
    newPara=false;
  });
  /* mark the last sentence of each question block, that is where the pause goes */
  for(var i=0;i<res.length;i++){
    res[i].qEnd = res[i].type==="q" && (i===res.length-1 || res[i+1].type!=="q");
  }
  return res;
}

/* ===================== voices ===================== */
function loadVoices(){
  if(!("speechSynthesis" in window)) return;
  voices=window.speechSynthesis.getVoices()||[];
  fillVoiceSelects();
}
function fillVoiceSelects(){
  ["de","ko"].forEach(function(code){
    var sel=document.getElementById(code==="de"?"voiceDe":"voiceKo");
    if(!sel) return;
    var list=voices.filter(function(v){ return (v.lang||"").toLowerCase().indexOf(code)===0; });
    var keep=S[code==="de"?"voiceDe":"voiceKo"];
    sel.innerHTML=list.length
      ? list.map(function(v){ return '<option value="'+esc(v.name)+'">'+esc(v.name+" ("+v.lang+")")+'</option>'; }).join("")
      : '<option value="">—</option>';
    if(keep&&list.some(function(v){ return v.name===keep; })) sel.value=keep;
  });
}
function voiceFor(code){
  var want=code==="ko"?document.getElementById("voiceKo").value:document.getElementById("voiceDe").value;
  var v=voices.filter(function(x){ return x.name===want; })[0];
  if(v) return v;
  return voices.filter(function(x){ return (x.lang||"").toLowerCase().indexOf(code)===0; })[0]||null;
}

/* ===================== settings ===================== */
function loadSettings(){
  var s=lsGet(K_SET,null);
  if(s) for(var k in S) if(s[k]!==undefined) S[k]=s[k];
}
window.saveSettings=function(){
  S.voiceDe=document.getElementById("voiceDe").value;
  S.voiceKo=document.getElementById("voiceKo").value;
  lsSet(K_SET,S);
};
function segment(id,items,active,cb){
  var el=document.getElementById(id);
  el.innerHTML=items.map(function(it){
    return '<button data-v="'+esc(String(it.v))+'"'+(String(it.v)===String(active)?' class="on"':'')+'>'+esc(it.label)+'</button>';
  }).join("");
  Array.prototype.forEach.call(el.querySelectorAll("button"),function(b){
    b.onclick=function(){
      Array.prototype.forEach.call(el.querySelectorAll("button"),function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      cb(b.getAttribute("data-v"));
    };
  });
}
function buildSegments(){
  segment("segSpeed",[{v:0.7,label:"0.7×"},{v:0.85,label:"0.85×"},{v:1,label:"1×"},
                      {v:1.25,label:"1.25×"},{v:1.5,label:"1.5×"}],S.speed,function(v){
    S.speed=parseFloat(v); lsSet(K_SET,S);
    if(playing){ restartCurrent(); }
  });
  segment("segLoop",[{v:1,label:t("loop.1")},{v:2,label:t("loop.2")},{v:3,label:t("loop.3")},
                     {v:5,label:t("loop.5")},{v:0,label:t("loop.inf")}],S.loop,function(v){
    S.loop=parseInt(v,10); lsSet(K_SET,S); updateMeta();
  });
  segment("segSent",[{v:1,label:t("sent.1")},{v:2,label:t("sent.2")},{v:3,label:t("sent.3")}],S.sentRep,function(v){
    S.sentRep=parseInt(v,10); lsSet(K_SET,S);
  });
  segment("segQa",[{v:1,label:t("qa.on")},{v:0,label:t("qa.off")}],S.qa?1:0,function(v){
    S.qa=v==="1"; lsSet(K_SET,S);
    document.getElementById("qaPauseWrap").hidden=!S.qa;
  });
  segment("segPause",[{v:2,label:"2s"},{v:3,label:"3s"},{v:5,label:"5s"},{v:8,label:"8s"},{v:12,label:"12s"}],
    S.qaPause,function(v){ S.qaPause=parseInt(v,10); lsSet(K_SET,S); });
  document.getElementById("qaPauseWrap").hidden=!S.qa;
  segment("segSleep",[{v:0,label:t("sleep.off")},{v:30,label:t("sleep.30")},
                      {v:60,label:t("sleep.60")},{v:120,label:t("sleep.120")}],0,function(v){
    setSleep(parseInt(v,10));
  });
}

/* ===================== sleep timer ===================== */
function setSleep(min){
  if(sleepTimer){ clearTimeout(sleepTimer); sleepTimer=null; }
  if(sleepTick){ clearInterval(sleepTick); sleepTick=null; }
  if(!min){ sleepEnd=0; updateDockNow(); toast(t("t.sleepOff")); return; }
  sleepEnd=Date.now()+min*60000;
  sleepTimer=setTimeout(function(){
    stop(); sleepEnd=0; updateDockNow(); toast(t("t.sleepDone"));
    var el=document.getElementById("segSleep");
    Array.prototype.forEach.call(el.querySelectorAll("button"),function(x){
      x.classList.toggle("on",x.getAttribute("data-v")==="0"); });
  },min*60000);
  sleepTick=setInterval(updateDockNow,20000);
  updateDockNow();
  toast(t("t.sleepSet",min));
}

/* ===================== player ===================== */
function haveTts(){ return ("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window); }

function startIndex(){ return rangeA!=null?rangeA:0; }
function endIndex(){ return rangeB!=null?rangeB:chunks.length-1; }

window.togglePlay=function(){
  if(!chunks.length) return;
  if(playing) pause(); else play();
};
function play(){
  if(!haveTts()) return;
  if(!voices.length) loadVoices();
  if(idx<startIndex()||idx>endIndex()) idx=startIndex();
  playing=true; pausedByUs=false;
  document.getElementById("btnPlay").textContent=t("btn.pause");
  requestWake();
  if(sentLeft<=0) sentLeft=S.sentRep;
  speakCurrent();
}
function pause(){
  playing=false;
  pausedByUs=true;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  document.getElementById("btnPlay").textContent=t("btn.play");
  releaseWake();
  saveProgress();
}
function stop(){
  pause();
  sentLeft=0;
}
window.stopAll=stop;

function speakCurrent(){
  if(!playing) return;
  var c=chunks[idx];
  if(!c){ finish(); return; }
  highlight();
  var u=new SpeechSynthesisUtterance(c.text);
  var v=voiceFor(c.lang);
  if(v){ u.voice=v; u.lang=v.lang; } else { u.lang=c.lang==="ko"?"ko-KR":"de-DE"; }
  u.rate=S.speed;
  u.onend=function(){
    if(!playing) return;
    curUtt=null;
    var wait=0;
    if(S.qa&&c.qEnd) wait=S.qaPause*1000;
    setTimeout(afterChunk,wait);
  };
  u.onerror=function(){ if(playing) setTimeout(afterChunk,120); };
  curUtt=u;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  try{ window.speechSynthesis.speak(u); }catch(e){}
}
function afterChunk(){
  if(!playing) return;
  sentLeft--;
  if(sentLeft>0){ speakCurrent(); return; }
  sentLeft=S.sentRep;
  if(idx>=endIndex()){
    loopDone++;
    if(S.loop===0||loopDone<S.loop){ idx=startIndex(); updateMeta(); speakCurrent(); }
    else finish();
    return;
  }
  idx++; updateMeta(); saveProgress(); speakCurrent();
}
function finish(){
  playing=false; loopDone=0;
  document.getElementById("btnPlay").textContent=t("btn.play");
  try{ window.speechSynthesis.cancel(); }catch(e){}
  releaseWake(); saveProgress(); toast(t("t.done"));
}
function restartCurrent(){
  if(!playing) return;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  speakCurrent();
}
window.nextSent=function(){
  if(!chunks.length) return;
  if(idx<endIndex()) idx++; else idx=startIndex();
  sentLeft=S.sentRep; updateMeta();
  if(playing) restartCurrent(); else highlight();
  saveProgress();
};
window.prevSent=function(){
  if(!chunks.length) return;
  if(idx>startIndex()) idx--; else idx=endIndex();
  sentLeft=S.sentRep; updateMeta();
  if(playing) restartCurrent(); else highlight();
  saveProgress();
};
function jumpTo(i){
  idx=Math.max(0,Math.min(chunks.length-1,i));
  sentLeft=S.sentRep; updateMeta();
  if(playing) restartCurrent(); else highlight();
  saveProgress();
}

/* keep the screen awake while reading (iOS stops speech when it locks) */
function requestWake(){
  if(navigator.wakeLock&&navigator.wakeLock.request&&!wake){
    navigator.wakeLock.request("screen").then(function(w){ wake=w; },function(){});
  }
}
function releaseWake(){ if(wake){ try{ wake.release(); }catch(e){} wake=null; } }

/* ===================== rendering ===================== */
function renderReader(){
  var box=document.getElementById("reader");
  box.innerHTML=chunks.map(function(c,i){
    return (c.para&&i>0?'<div class="parabreak"></div>':"")+
      '<div class="sent '+c.type+'" data-i="'+i+'"><span class="n">'+(i+1)+'</span>'+esc(c.text)+'</div>';
  }).join("");
  Array.prototype.forEach.call(box.querySelectorAll(".sent"),function(el){
    el.onclick=function(){ jumpTo(Number(el.getAttribute("data-i"))); };
  });
  highlight();
}
function highlight(){
  var box=document.getElementById("reader");
  var a=startIndex(), b=endIndex();
  Array.prototype.forEach.call(box.querySelectorAll(".sent"),function(el){
    var i=Number(el.getAttribute("data-i"));
    el.classList.toggle("now",i===idx);
    el.classList.toggle("inrange",(rangeA!=null||rangeB!=null)&&i>=a&&i<=b);
  });
  var cur2=box.querySelector(".sent.now");
  if(cur2){
    var top=cur2.offsetTop-box.clientHeight/2+cur2.clientHeight/2;
    box.scrollTo({top:Math.max(0,top),behavior:"smooth"});
  }
  updateMeta();
}
function updateMeta(){
  document.getElementById("mPos").textContent=
    t("pos",Math.min(idx+1,chunks.length),chunks.length)+
    (S.loop===0?t("loopPos",loopDone+1):(S.loop>1?t("loopPosN",Math.min(loopDone+1,S.loop),S.loop):""));
  document.getElementById("mBar").style.width=
    (chunks.length?((idx+1)/chunks.length*100):0)+"%";
  document.getElementById("rangeInfo").textContent=
    (rangeA!=null&&rangeB!=null)?t("range.on",rangeA+1,rangeB+1):t("range.none");
  updateDockNow();
}
function updateDockNow(){
  var c=chunks[idx];
  var s=c?c.text:"";
  if(s.length>70) s=s.slice(0,69)+"…";
  var extra="";
  if(sleepEnd){
    var left=Math.max(0,Math.round((sleepEnd-Date.now())/60000));
    extra=' · <span class="sleepon">'+esc(t("sleepIn",left))+'</span>';
  }
  document.getElementById("dockNow").innerHTML=esc(s)+extra;
}

/* ===================== range ===================== */
window.setRange=function(which){
  if(!chunks.length) return;
  if(which==="a"){ rangeA=idx; if(rangeB!=null&&rangeB<rangeA) rangeB=null; toast(t("t.rangeA",idx+1)); }
  else{
    if(rangeA==null){ toast(t("range.needA")); return; }
    if(idx<rangeA){ toast(t("t.rangeBad")); return; }
    rangeB=idx; toast(t("t.rangeB",idx+1));
  }
  loopDone=0; highlight(); saveProgress();
};
window.clearRange=function(){ rangeA=null; rangeB=null; loopDone=0; highlight(); toast(t("t.rangeOff")); saveProgress(); };

/* ===================== library ===================== */
function saveProgress(){
  if(!cur) return;
  cur.lastIdx=idx; cur.rangeA=rangeA; cur.rangeB=rangeB; cur.opened=Date.now();
  var i=lib.map(function(x){ return x.id; }).indexOf(cur.id);
  if(i>=0) lib[i]=cur; else lib.unshift(cur);
  lsSet(K_LIB,lib);
}
function renderLib(){
  var box=document.getElementById("libList");
  if(!lib.length){ box.innerHTML='<div class="empty">'+esc(t("lib.empty"))+'</div>'; return; }
  var sorted=lib.slice().sort(function(a,b){ return (b.opened||0)-(a.opened||0); });
  box.innerHTML=sorted.map(function(x){
    var d=new Date(x.opened||x.created||Date.now());
    var ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    var n=(x.count||0);
    var pos=(x.lastIdx||0)+1;
    return '<div class="lib" data-open="'+x.id+'">'+
      '<div class="t"><div class="nm">'+esc(x.title||"—")+'</div>'+
      '<div class="d">'+esc(ds)+' · '+esc(t("pos",Math.min(pos,n||pos),n))+'</div></div>'+
      '<button class="x" data-del="'+x.id+'" aria-label="delete">✕</button></div>';
  }).join("");
  Array.prototype.forEach.call(box.querySelectorAll("[data-open]"),function(el){
    el.onclick=function(){ openText(el.getAttribute("data-open")); };
  });
  Array.prototype.forEach.call(box.querySelectorAll("[data-del]"),function(b){
    b.onclick=function(e){ e.stopPropagation(); delText(b.getAttribute("data-del")); };
  });
}
function openText(id){
  var x=lib.filter(function(y){ return y.id===id; })[0];
  if(!x) return;
  cur=x;
  chunks=buildChunks(x.text);
  x.count=chunks.length;
  idx=Math.min(x.lastIdx||0,chunks.length-1);
  rangeA=(x.rangeA!=null&&x.rangeA<chunks.length)?x.rangeA:null;
  rangeB=(x.rangeB!=null&&x.rangeB<chunks.length)?x.rangeB:null;
  loopDone=0; sentLeft=S.sentRep;
  showPlayer();
  document.getElementById("mTitle").textContent=x.title||"";
  renderReader();
  saveProgress();
}
function delText(id){
  var x=lib.filter(function(y){ return y.id===id; })[0];
  if(!x) return;
  if(!confirm(t("c.delText",x.title||"—"))) return;
  lib=lib.filter(function(y){ return y.id!==id; });
  lsSet(K_LIB,lib);
  if(cur&&cur.id===id){ cur=null; chunks=[]; showInput(); }
  renderLib(); toast(t("t.deleted"));
}
window.backupLib=function(){
  var json=JSON.stringify({v:1,app:"ap2audio",exported:new Date().toISOString(),library:lib},null,2);
  var blob=new Blob([json],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download="AP2_Lernaudio_Backup_"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1500);
  toast(t("t.backup"));
};
window.restoreLib=function(ev){
  var f=ev.target.files&&ev.target.files[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      var arr=d.library||(Array.isArray(d)?d:null);
      if(!arr) throw new Error("bad");
      var have={}; lib.forEach(function(x){ have[x.id]=1; });
      var n=0;
      arr.forEach(function(x){ if(!x.id) x.id=uid(); if(!have[x.id]){ lib.push(x); n++; } });
      lsSet(K_LIB,lib); renderLib(); toast(t("t.restored",n));
    }catch(e){ toast(t("t.badFile")); }
    ev.target.value="";
  };
  fr.readAsText(f);
};

/* ===================== views ===================== */
function showInput(){
  stop();
  document.getElementById("viewInput").hidden=false;
  document.getElementById("viewLib").hidden=true;
  document.getElementById("viewPlay").hidden=true;
  document.getElementById("dock").hidden=true;
  document.getElementById("tabBtn").textContent=t("nav.lib");
}
function showPlayer(){
  document.getElementById("viewInput").hidden=true;
  document.getElementById("viewLib").hidden=true;
  document.getElementById("viewPlay").hidden=false;
  document.getElementById("dock").hidden=false;
  document.getElementById("btnPlay").textContent=t("btn.play");
  document.getElementById("tabBtn").textContent=t("nav.lib");
}
function showLib(){
  stop();
  document.getElementById("viewInput").hidden=true;
  document.getElementById("viewLib").hidden=false;
  document.getElementById("viewPlay").hidden=true;
  document.getElementById("dock").hidden=true;
  renderLib();
}
window.showInput=showInput;
window.toggleLib=function(){
  if(document.getElementById("viewLib").hidden) showLib();
  else if(cur&&chunks.length) showPlayer();
  else showInput();
};
window.editCurrent=function(){
  stop();
  if(cur){
    document.getElementById("textIn").value=cur.text;
    document.getElementById("titleIn").value=cur.title||"";
  }
  showInput();
};
window.clearText=function(){
  document.getElementById("textIn").value="";
  document.getElementById("titleIn").value="";
};

/* ===================== load text ===================== */
window.loadText=function(){
  var text=document.getElementById("textIn").value.trim();
  if(!text){ toast(t("t.needText")); return; }
  var title=document.getElementById("titleIn").value.trim();
  if(!title){
    title=text.split("\n")[0].replace(Q_RE,"").replace(Q_KO,"").slice(0,50)||"Text";
  }
  var built=buildChunks(text);
  if(!built.length){ toast(t("t.needText")); return; }
  if(cur&&cur.text===text){ cur.title=title; }
  else{
    cur={ id:uid(), title:title, text:text, created:Date.now(), opened:Date.now(),
          lastIdx:0, rangeA:null, rangeB:null, count:built.length };
  }
  chunks=built; cur.count=chunks.length;
  idx=Math.min(cur.lastIdx||0,chunks.length-1);
  rangeA=cur.rangeA; rangeB=cur.rangeB; loopDone=0; sentLeft=S.sentRep;
  saveProgress();
  showPlayer();
  document.getElementById("mTitle").textContent=title;
  renderReader();
  toast(t("t.loaded",chunks.length));
};

/* ===================== file import ===================== */
function loadScript(src){
  return new Promise(function(res,rej){
    var s=document.createElement("script");
    s.src=src; s.onload=function(){ res(); }; s.onerror=function(){ rej(new Error("load")); };
    document.head.appendChild(s);
  });
}
window.importFile=function(ev){
  var f=ev.target.files&&ev.target.files[0];
  ev.target.value="";
  if(!f) return;
  var isPdf=/\.pdf$/i.test(f.name)||f.type==="application/pdf";
  if(!isPdf){
    var fr=new FileReader();
    fr.onload=function(){
      document.getElementById("textIn").value=unwrap(String(fr.result||""));
      if(!document.getElementById("titleIn").value.trim())
        document.getElementById("titleIn").value=f.name.replace(/\.[^.]+$/,"");
    };
    fr.onerror=function(){ toast(t("t.fileErr")); };
    fr.readAsText(f);
    return;
  }
  toast(t("t.pdfLoading"));
  var ready=window.pdfjsLib?Promise.resolve():loadScript(PDFJS);
  ready.then(function(){
    if(!window.pdfjsLib) throw new Error("nopdfjs");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
    return f.arrayBuffer();
  }).then(function(buf){
    return window.pdfjsLib.getDocument({data:buf}).promise;
  }).then(function(pdf){
    var out=[], chain=Promise.resolve();
    for(var p=1;p<=pdf.numPages;p++){
      (function(page){
        chain=chain.then(function(){
          return pdf.getPage(page).then(function(pg){ return pg.getTextContent(); })
            .then(function(tc){
              var lastY=null, line=[], lines=[];
              tc.items.forEach(function(it){
                var y=it.transform&&it.transform[5];
                if(lastY!==null&&Math.abs(y-lastY)>3){ lines.push(line.join("")); line=[]; }
                line.push(it.str);
                lastY=y;
              });
              if(line.length) lines.push(line.join(""));
              out.push(lines.join("\n"));
            });
        });
      })(p);
    }
    return chain.then(function(){ return {text:out.join("\n\n"),pages:pdf.numPages}; });
  }).then(function(r){
    var clean=unwrap(r.text.replace(/[ \t]+/g," ")).trim();
    if(!clean){ toast(t("t.pdfEmpty")); return; }
    document.getElementById("textIn").value=clean;
    if(!document.getElementById("titleIn").value.trim())
      document.getElementById("titleIn").value=f.name.replace(/\.[^.]+$/,"");
    toast(t("t.pdfPages",r.pages));
  }).catch(function(e){
    toast((e&&e.message==="load")?t("t.pdfNet"):t("t.fileErr"));
  });
};

/* ===================== language ===================== */
window.setLang=function(l){
  if(l!==lang){ lang=l; try{ localStorage.setItem(K_LANG,l); }catch(e){} }
  applyLang();
};
function applyLang(){
  document.documentElement.setAttribute("lang",lang);
  document.getElementById("langKo").classList.toggle("on",lang==="ko");
  document.getElementById("langDe").classList.toggle("on",lang==="de");
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"),function(el){
    el.textContent=t(el.getAttribute("data-i18n"));
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-ph]"),function(el){
    el.setAttribute("placeholder",t(el.getAttribute("data-i18n-ph")));
  });
  document.getElementById("footNote").innerHTML=t("foot.note");
  document.getElementById("verLine").textContent=t("ver.label")+" v"+APP_VER;
  document.getElementById("btnPlay").textContent=t(playing?"btn.pause":"btn.play");
  buildSegments();
  if(chunks.length) updateMeta();
  renderLib();
}

/* ===================== init ===================== */
(function init(){
  var sl=null; try{ sl=localStorage.getItem(K_LANG); }catch(e){}
  if(sl==="ko"||sl==="de") lang=sl;
  else lang=(navigator.language||"").toLowerCase().indexOf("ko")===0?"ko":"de";

  lib=lsGet(K_LIB,[]);
  loadSettings();

  if(!haveTts()) document.getElementById("noTts").hidden=false;
  applyLang();
  loadVoices();
  if("speechSynthesis" in window){
    window.speechSynthesis.onvoiceschanged=loadVoices;
    setTimeout(loadVoices,600);
    setTimeout(loadVoices,1800);
  }
  if(lib.length) showLib(); else showInput();

  document.addEventListener("visibilitychange",function(){
    if(document.hidden&&playing) pause();
  });
  window.addEventListener("pagehide",function(){ try{ window.speechSynthesis.cancel(); }catch(e){} });
})();
})();
</script>
